name: Build Mobile APK

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: mobile-app/package-lock.json

      - name: Setup Expo & EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Install mobile app dependencies
        working-directory: mobile-app
        run: npm install

      - name: Build APK with EAS
        working-directory: mobile-app
        env:
          EXPO_PUBLIC_API_URL: ${{ secrets.EXPO_PUBLIC_API_URL }}
        run: eas build --platform android --profile preview --non-interactive --wait

      - name: Download APK from EAS
        working-directory: mobile-app
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          APK_URL=$(eas build:list --platform android --limit 1 --status finished --json | python3 -c "import sys,json; builds=json.load(sys.stdin); print(builds[0]['artifacts']['buildUrl'])")
          curl -L "$APK_URL" -o ../airis-android.apk

      - name: Get tag name
        id: tag
        run: echo "TAG=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT

      - name: Upload APK to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.TAG }}
          name: 'AIRIS ${{ steps.tag.outputs.TAG }}'
          body: |
            ## AIRIS Mobile App (Android APK)

            Download `airis-android.apk` below.

            **Install steps:**
            1. Download `airis-android.apk` to your Android phone
            2. Open the file — tap "Install anyway" if prompted
            3. Open AIRIS and start chatting
          draft: false
          prerelease: false
          files: airis-android.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
