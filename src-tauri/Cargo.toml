[package]
name = "airis"
version = "1.0.0"
description = "AIRIS - Advanced AI Personal Assistant"
authors = ["AIRIS Team"]
license = "MIT"
repository = "https://github.com/yourusername/ai--assistant-pr1"
default-run = "tauri"
edition = "2021"
rust-version = "1.60"

[build-dependencies]
tauri-build = { version = "2.0", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
tauri = { version = "2.0", features = ["shell-open", "fs-all", "os-all", "http-all"] }
tokio = { version = "1", features = ["full"] }
uuid = { version = "1.0", features = ["v4", "serde"] }
reqwest = { version = "0.11", features = ["json"] }
log = "0.4"
env_logger = "0.11"

[features]
# By default Tauri doesn't include API for running background processes
# See https://tauri.app/docs/api/js/shell for more info
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[profile.release]
codegen-units = 1
lto = true
